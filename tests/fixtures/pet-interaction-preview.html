<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鱼娘交互气泡 · 仅布局演示</title><link rel="stylesheet" href="/src/assistant.css"><link rel="stylesheet" href="/src/pet/interactions.css"><style>body{display:flex;align-items:center;flex-direction:column;background:#18212b;padding-top:12px;overflow:auto}#assistant-root{width:360px;height:320px;flex-shrink:0}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px}#result{color:#c9d7e5;font-size:12px;white-space:pre-wrap;max-width:450px}</style></head><body><div id="assistant-root"><section class="pet-shell"><div class="pet-stage"><video class="pet-media" autoplay muted loop playsinline src="/pet/dsh-pet/webm/%E5%BE%85%E6%9C%BA%E5%91%BC%E5%90%B8%E4%BC%91%E9%97%B2.webm"></video></div><div id="pet-interaction"></div><div class="pet-attribution"><a class="pet-credit" href="https://github.com/PC2005-cloud/dsh-pet">dsh-pet · PC2005-cloud</a><span class="asset-license">动画素材禁止商用</span></div></section></div><div class="controls"><button id="questions">演示问题</button><button id="approval">演示权限</button><button id="plan">演示计划</button></div><p id="result">纯布局演示，不连接 DSH、不执行命令、不发送实际授权。</p><script type="module">
import {PetInteractions} from '/src/pet/interactions.ts';
let revision=0;
const result=document.getElementById('result');
const ui=new PetInteractions(document.getElementById('pet-interaction'),{onSubmit:async(id,reply)=>{result.textContent='演示提交（无副作用）：'+JSON.stringify(reply);ui.update({revision:++revision,connected:true,items:[]});},onOpen:async()=>{result.textContent='演示：未进行实际跳转。';}});
const show=card=>ui.update({revision:++revision,connected:true,items:[{id:'demo-'+revision,agent_label:'仅布局演示 · 非真实会话',answerable:true,can_allow:false,...card}]});
document.getElementById('questions').onclick=()=>show({kind:'questions',questions:[{id:'mode',question:'希望如何完成这项任务？',options:[{label:'先检查再修改',description:'先核对当前状态，再做必要更改。'},{label:'只输出建议',description:'不修改任何文件。'}]},{id:'notes',question:'还有哪些要求？'}]});
document.getElementById('approval').onclick=()=>show({kind:'approval',tool_name:'bash',reason:'仅展示完整参数和一次性确认按钮；此页面不会执行命令。',details:JSON.stringify({tool_name:'bash',call_id:'demo-call',arguments:{command:"printf '仅演示，不执行'",workdir:'/tmp/preview-only',justification:'布局验收，无授权副作用'}},null,2),can_allow:true});
document.getElementById('plan').onclick=()=>show({kind:'questions',questions:[{id:'plan-review',header:'计划确认',question:'是否批准此完整计划？',detail:"# 演示计划\n\n## 目标\n在气泡内安全完成确认。\n\n## 步骤\n1. 查看完整信息。\n2. 明确选择后提交。\n3. 已处理请求同步失效。\n\n本页面不运行真实工具。",options:[{label:'Approve',description:'批准后进入下一步（演示不执行）。'},{label:'Keep planning',description:'继续调整计划，可填写反馈。'}],intent:{kind:'plan-review',approve:'Approve'}}]});
window.addEventListener('pagehide',()=>ui.dispose(),{once:true});
</script></body></html>
