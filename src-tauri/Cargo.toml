[package]
name = "dsh-wsl-desktop"
version = "0.1.27"
description = "Windows launcher for DeepSeek Harness in WSL"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Evan Yang"]
repository = "https://github.com/elves-ai/dsh-wsl-desktop"

[lib]
name = "dsh_wsl_desktop"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
semver = "1"
sha2 = "0.10"
# Pure read-only RPC transport is also tested on Linux without a GUI.
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
# Match the COM ABI used by Tauri/Wry; WinRT toasts keep their separate 0.61 dependency.
webview2-com = "=0.39.1"
windows-webview = { package = "windows", version = "=0.62.2", features = ["Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices"] }
tauri-plugin-single-instance = "2"
# Pin the verified desktop API; Cargo.lock also holds notify-rust at 4.11.7
# (later backend releases raise the minimum Rust version).
tauri-plugin-notification = "=2.3.3"
# Retain WinRT toast handles and activation callbacks while the launcher is running.
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT"] }
base64 = "0.22"
# Windows system TLS/certificate store; updater packages are direct NSIS EXEs, not legacy ZIPs.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
open = "5"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Power", "Win32_Media_Audio"] }

[dev-dependencies]
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
