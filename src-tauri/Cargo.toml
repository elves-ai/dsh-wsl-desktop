[package]
name = "dsh-wsl-desktop"
version = "0.1.3"
description = "Windows launcher for DeepSeek Harness in WSL"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Evan Yang"]
repository = "https://github.com/elves-ai/dsh-wsl-desktop"

[lib]
name = "dsh_wsl_desktop"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
semver = "1"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# Windows system TLS/certificate store; updater packages are direct NSIS EXEs, not legacy ZIPs.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
open = "5"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
