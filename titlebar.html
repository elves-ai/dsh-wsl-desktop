<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH 标题栏</title>
    <script type="module" src="/src/titlebar.ts"></script>
  </head>
  <body>
    <header id="titlebar" class="titlebar" aria-label="窗口标题栏" data-focused="true">
      <span id="app-logo" class="app-icon" aria-hidden="true">
        <img src="/app-icon.png" width="16" height="16" alt="" />
      </span>
      <button id="titlebar-settings" class="settings-control" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 2.5 5 0 .6 2.3 1.7 1 2.3-.6 2.5 4.3-1.7 1.7v1.6l1.7 1.7-2.5 4.3-2.3-.6-1.7 1-.6 2.3h-5l-.6-2.3-1.7-1-2.3.6-2.5-4.3 1.7-1.7v-1.6L2.9 9.5l2.5-4.3 2.3.6 1.7-1z" /><circle cx="12" cy="12" r="3" /></svg></button>
      <button id="titlebar-updates" class="update-control" type="button" aria-label="软件更新" title="软件更新" data-update-available="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 15v5h14v-5" /></svg><span id="titlebar-update-dot" class="update-dot" aria-hidden="true" hidden></span></button>
      <div id="drag-area" class="drag-area" title="拖动窗口；双击最大化或还原">
        <span id="window-title" class="window-title">DeepSeek Harness</span>
      </div>
      <div class="window-controls" aria-label="窗口控制">
        <button id="window-minimize" class="window-control" type="button" aria-label="最小化" title="最小化"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10" /></svg></button>
        <button id="window-maximize" class="window-control" type="button" aria-label="最大化" title="最大化" data-maximized="false"><svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z" /></svg><svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5h7v7h-7zM3.5 10.5h-1v-8h8v1" /></svg></button>
        <button id="window-close" class="window-control close-control" type="button" aria-label="关闭窗口（隐藏到托盘）" title="关闭窗口（隐藏到托盘）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9" /></svg></button>
      </div>
      <span id="titlebar-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
    </header>
  </body>
</html>
