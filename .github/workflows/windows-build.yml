name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    name: Tests and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag against application versions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs validate
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test frontend and security configuration
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Test stop ownership guard with fake services
        run: python -m unittest discover -s tests -p test_guarded_stop.py -v
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust core without touching WSL
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  build-windows:
    name: Windows x64 installer
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Require updater signing key for trusted tag build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Tagged releases require the TAURI_SIGNING_PRIVATE_KEY secret.'
          }
      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend for native tests
        run: npm run build
      - name: Test on Windows without launching the app
        run: |
          npm test 2>&1 | Tee-Object -FilePath windows-frontend-test.log
          if ($LASTEXITCODE -ne 0) {
            $details = ((Get-Content windows-frontend-test.log -Tail 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows frontend tests::$details"
            throw 'Frontend tests failed.'
          }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked 2>&1 | Tee-Object -FilePath windows-rust-test.log
          if ($LASTEXITCODE -ne 0) {
            $details = ((Get-Content windows-rust-test.log -Tail 100) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Rust tests::$details"
            throw 'Windows Rust tests failed.'
          }
      - name: Build signed Windows application and NSIS installer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run desktop:build -- --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) {
            $details = ((Get-Content windows-build.log -Tail 100) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer build::$details"
            throw 'Windows installer build failed.'
          }
      - name: Build Windows application and NSIS installer
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          $override = Join-Path $env:RUNNER_TEMP 'tauri-no-updater.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $override -Encoding utf8
          npm run desktop:build -- --ci --config $override --target x86_64-pc-windows-msvc --bundles nsis -- --locked 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned Windows installer build failed.' }
      - name: Collect executable, installer and SHA256 checksums
        env:
          IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $output = Join-Path $PWD 'artifacts/windows'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $release 'dsh-wsl-desktop.exe') -Destination $output
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $release 'bundle/nsis') -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $version = (Get-Content -LiteralPath (Join-Path $PWD 'package.json') -Raw | ConvertFrom-Json).version
          $installerName = 'dsh-wsl-desktop_' + $version + '_x64-setup.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $output $installerName)
          if ($env:IS_RELEASE -eq 'true') {
            Copy-Item -LiteralPath ($installers[0].FullName + '.sig') -Destination (Join-Path $output ($installerName + '.sig'))
          }
          $checksums = Get-ChildItem -LiteralPath $output -Filter '*.exe' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
      - name: Prepare and verify signed updater release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs prepare artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Signed updater release validation failed.' }
      - name: Upload Windows downloads
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsh-wsl-desktop-windows-x64-${{ github.run_number }}
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Write download instructions
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          @"
          ## Windows x64 build
          - [Download installer, executable and checksums]($env:DOWNLOAD_URL)
          - The application uses the existing WSL installation and imports the legacy launcher configuration.
          - No Authenticode signature yet: Windows SmartScreen may warn. Tag releases have separate Tauri updater signatures.
          - CI builds and tests the application; it does not run or restart your WSL service.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload failed Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-build-diagnostics-${{ github.run_number }}
          path: windows-*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Publish tagged GitHub Release
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate release version
        id: version
        run: node scripts/release.mjs validate
      - name: Download verified Windows build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dsh-wsl-desktop-windows-x64-${{ github.run_number }}
          path: artifacts/windows
      - name: Verify release files and checksums
        run: node scripts/release.mjs verify artifacts/windows
      - name: Publish complete release without overwriting published versions
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            "Windows x64 release built from commit $GITHUB_SHA." \
            "" \
            "Includes the signed NSIS updater, standalone executable, latest.json and SHA256SUMS.txt." \
            "" \
            "Updater signatures verify authenticity in-app; Authenticode signing is still pending and Windows SmartScreen may warn." \
            "MIT license. Requires an existing WSL DSH installation and Microsoft WebView2 Runtime." \
            "" \
            "[Usage and privacy information](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/DOWNLOADS.md)" > "$notes"
          if is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::This version is already published; refusing to overwrite release assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$GITHUB_SHA" --title "DSH WSL Desktop $RELEASE_TAG" --notes-file "$notes" --draft
          fi
          assets=(artifacts/windows/*.exe artifacts/windows/*.exe.sig artifacts/windows/latest.json artifacts/windows/SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          printf '%s\n' "${assets[@]##*/}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
          latest=true
          if [[ "$IS_PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease="$IS_PRERELEASE" --latest="$latest" --notes-file "$notes"
          printf '[Download Release %s](https://github.com/%s/releases/tag/%s)\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
