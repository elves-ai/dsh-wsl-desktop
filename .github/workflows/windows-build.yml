name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    name: Tests and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test frontend and security configuration
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Test stop ownership guard with fake services
        run: python -m unittest discover -s tests -p test_guarded_stop.py -v
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust core without touching WSL
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  build-windows:
    name: Windows x64 installer
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend for native tests
        run: npm run build
      - name: Test on Windows without launching the app
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows Rust tests failed.' }
      - name: Build Windows application and NSIS installer
        run: npm run desktop:build -- --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Collect executable, installer and SHA256 checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $output = Join-Path $PWD 'artifacts/windows'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $release 'dsh-wsl-desktop.exe') -Destination $output
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $release 'bundle/nsis') -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'No NSIS installer was produced.' }
          foreach ($installer in $installers) { Copy-Item -LiteralPath $installer.FullName -Destination $output }
          $checksums = Get-ChildItem -LiteralPath $output -Filter '*.exe' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload Windows downloads
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsh-wsl-desktop-windows-x64-${{ github.run_number }}
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Write download instructions
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          @"
          ## Windows x64 build
          - [Download installer, executable and checksums]($env:DOWNLOAD_URL)
          - The application uses the existing WSL installation and imports the legacy launcher configuration.
          - This build is unsigned. Windows SmartScreen may warn; verify the source and SHA256 before running.
          - CI builds and tests the application; it does not run or restart your WSL service.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
